name: release

# Push a tag like v2.10.2 and this builds the jar, checks the tag matches pom.xml,
# and publishes a GitHub Release with the jar and its SHA-256 attached.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: dev-command-repository
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Check tag matches pom version
        run: |
          VERSION=$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pom.xml version $VERSION"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and test
        run: mvn -B package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Checksum
        run: |
          cd target
          sha256sum "stonks-$VERSION.jar" > "stonks-$VERSION.jar.sha256"

      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[?" v "\\]?( |$)" {on=1; next}
            on && /^## / {exit}
            on {print}
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md." > notes.md

      - name: Publish release
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "target/stonks-$VERSION.jar" "target/stonks-$VERSION.jar.sha256" \
            --title "Stonks $VERSION" --notes-file notes.md --verify-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
